<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Photo favicon, circle-masked with a transparent surround so it matches
         the round avatar in the navbar.
         ?v= is a cache-buster: browsers pin a site's favicon hard and will keep
         serving a stale one past a normal reload, so the query has to change
         whenever the image does.
         No SVG <link> here on purpose — when both are offered Chrome may pick
         the SVG, which would put the old "M" mark back in the tab.
         apple-touch-icon is a separate OPAQUE square: iOS discards alpha and
         composites onto black, then applies its own rounding. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Muhammad Ali Khan — Full Stack Developer, AI Engineer and Cyber Security Student. Building modern web and mobile applications with React, React Native, Node.js, Firebase and AI."
    />
    <!-- Social share preview — the promo card is purpose-built for this -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Muhammad Ali Khan — Full Stack &amp; React Native Developer" />
    <meta
      property="og:description"
      content="Full Stack Developer, AI Engineer and Cyber Security Student. Building modern web and mobile applications with React, React Native, Node.js and Firebase."
    />
    <meta property="og:image" content="/og-image.jpeg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.jpeg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Muhammad Ali Khan — Full Stack &amp; React Native Developer</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Mirrors the resolution order in src/hooks/useTheme.js: stored choice
      // first, otherwise the OS preference.
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'light' ? '#f8fafc' : '#0f172a')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
